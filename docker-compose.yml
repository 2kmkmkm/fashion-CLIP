version: '3.8'

services:
  qdrant:
    image: 02dlrudals/fitzza-qdrant:latest
    # 로컬에서 직접 빌드하려면 아래 build 주석을 해제하세요.
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: fitzza_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # Qdrant REST API 및 Web UI Dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # Qdrant gRPC API
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=true
    # 데이터가 컨테이너 재실행 시 유지되도록 영속 볼륨을 지정할 수 있습니다.
    # volumes:
    #   - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

# volumes:
#   qdrant_storage:
